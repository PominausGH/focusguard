<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <link rel="canonical" href="https://app.focusshield.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FocusShield" />
    <meta property="og:url" content="https://app.focusshield.app/" />
    <meta property="og:title" content="FocusShield – 5-Task Daily Limit & Pomodoro Timer" />
    <meta
      property="og:description"
      content="Run a hard 5-task daily limit with a built-in Pomodoro timer, ambient sounds, and streak tracking. Free account, no credit card."
    />
    <meta property="og:image" content="https://app.focusshield.app/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FocusShield – 5-Task Daily Limit & Pomodoro Timer" />
    <meta
      name="twitter:description"
      content="Run a hard 5-task daily limit with a built-in Pomodoro timer, ambient sounds, and streak tracking. Free account, no credit card."
    />
    <meta name="twitter:image" content="https://app.focusshield.app/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FocusShield",
        "url": "https://app.focusshield.app/",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
