  - generic [ref=e104]:
    - heading "Frequently Asked Questions" [level=2] [ref=e105]
    - generic [ref=e106]:
      - heading "Is FocusShield completely free?" [level=3] [ref=e107]
      - paragraph [ref=e108]: Yes — 100% free, forever. No subscription, no premium tier, no ads. FocusShield is also fully open source on GitHub.
    - generic [ref=e109]:
      - heading "Do I need to sign up or create an account?" [level=3] [ref=e110]
      - paragraph [ref=e111]: Yes, a free account is required to use FocusShield. Sign up takes seconds and lets your tasks, streaks, and focus history sync across devices.
    - generic [ref=e112]:
      - heading "Why only 5 tasks per day?" [level=3] [ref=e113]
      - paragraph [ref=e114]: The limit is deliberate. Research in decision psychology shows that constraining choices reduces decision fatigue and increases follow-through. You pick what actually matters — not everything.
    - generic [ref=e115]:
      - heading "What Pomodoro timer presets are available?" [level=3] [ref=e116]
      - paragraph [ref=e117]: "Three presets: Classic 25/5, Deep Work 50/10, and Sprint 15/5. Each session links to a task so every focused minute is tracked against real work."
    - generic [ref=e118]:
      - heading "Does FocusShield work on mobile?" [level=3] [ref=e119]
      - paragraph [ref=e120]: Yes. FocusShield is a responsive web app that works on desktop, tablet, and mobile browsers. No app store download required.
    - generic [ref=e121]:
      - heading "How does the meeting cost calculator work?" [level=3] [ref=e122]
      - paragraph [ref=e123]: Enter your team size and average salary. FocusShield calculates and displays the running cost of your meeting in real time, in USD — so teams can decide whether a meeting is worth the time.
    - generic [ref=e124]:
      - heading "Can I export my productivity data?" [level=3] [ref=e125]
      - paragraph [ref=e126]: Yes. The analytics section lets you view completed tasks, focus session history, and productivity trends, with an export option for your records.
    - generic [ref=e127]:
      - heading "How is FocusShield different from Forest or other Pomodoro apps?" [level=3] [ref=e128]
      - paragraph [ref=e129]: FocusShield is free (no credit card required) and combines a hard task limit with a Pomodoro timer in a single web app. Forest requires a paid download. FocusShield runs in any browser — just sign up and start.
