  - generic [ref=f2e120]:
    - heading "Frequently Asked Questions" [level=2] [ref=f2e121]
    - generic [ref=f2e122]:
      - heading "Is FocusShield completely free?" [level=3] [ref=f2e123]
      - paragraph [ref=f2e124]: Yes — 100% free, forever. No subscription, no premium tier, no ads. FocusShield is also fully open source on GitHub.
    - generic [ref=f2e125]:
      - heading "Do I need to sign up or create an account?" [level=3] [ref=f2e126]
      - paragraph [ref=f2e127]: Yes, a free account is required to use FocusShield. Sign up takes seconds and lets your tasks, streaks, and focus history sync across devices.
    - generic [ref=f2e128]:
      - heading "Why only 5 tasks per day?" [level=3] [ref=f2e129]
      - paragraph [ref=f2e130]: The limit is deliberate. Research in decision psychology shows that constraining choices reduces decision fatigue and increases follow-through. You pick what actually matters — not everything.
    - generic [ref=f2e131]:
      - heading "What Pomodoro timer presets are available?" [level=3] [ref=f2e132]
      - paragraph [ref=f2e133]: "Three presets: Classic 25/5, Deep Work 50/10, and Sprint 15/5. Each session links to a task so every focused minute is tracked against real work."
    - generic [ref=f2e134]:
      - heading "Does FocusShield work on mobile?" [level=3] [ref=f2e135]
      - paragraph [ref=f2e136]: Yes. FocusShield is a responsive web app that works on desktop, tablet, and mobile browsers. No app store download required.
    - generic [ref=f2e137]:
      - heading "How does the meeting cost calculator work?" [level=3] [ref=f2e138]
      - paragraph [ref=f2e139]: Enter your team size and average salary. FocusShield calculates and displays the running cost of your meeting in real time, in USD — so teams can decide whether a meeting is worth the time.
    - generic [ref=f2e140]:
      - heading "Can I export my productivity data?" [level=3] [ref=f2e141]
      - paragraph [ref=f2e142]: Yes. The analytics section lets you view completed tasks, focus session history, and productivity trends, with an export option for your records.
    - generic [ref=f2e143]:
      - heading "How is FocusShield different from Forest or other Pomodoro apps?" [level=3] [ref=f2e144]
      - paragraph [ref=f2e145]: FocusShield is free (no credit card required) and combines a hard task limit with a Pomodoro timer in a single web app. Forest requires a paid download. FocusShield runs in any browser — just sign up and start.
