services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focusshield-frontend
    restart: unless-stopped
    ports:
    - 127.0.0.1:3012:80
    depends_on:
    - api
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://127.0.0.1/
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 200
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    - NET_BIND_SERVICE
    volumes:
    - ./public/blog:/usr/share/nginx/html/blog
    - ./public/sitemap.xml:/usr/share/nginx/html/sitemap.xml
    - ./public/.well-known/security.txt:/usr/share/nginx/html/.well-known/security.txt
    networks:
    - default
    - postgres-main-network
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focusshield-api
    restart: unless-stopped
    ports:
    - 127.0.0.1:3011:3000
    environment:
    - DATABASE_URL=postgresql://focusshield:${DB_PASSWORD:?DB_PASSWORD required}@postgres-main:5432/focusshield
    - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
    - JWT_EXPIRES_IN=7d
    - NODE_ENV=production
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:3000/health
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 200
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    networks:
    - default
    - postgres-main-network
networks:
  default:
    driver: bridge
  postgres-main-network:
    external: true
